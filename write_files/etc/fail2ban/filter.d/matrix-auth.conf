[Definition]
# Fail2ban filter for Matrix/Conduit authentication failures
# Matches Conduit log patterns for failed login attempts

failregex = ^.*\[WARN\].*\sFailed login attempt.*from <HOST>.*$
            ^.*401 Unauthorized.*client_ip=<HOST>.*$
            ^.*"M_FORBIDDEN".*<HOST>.*$

ignoreregex =
